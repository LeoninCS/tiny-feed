# 一键启动 MySQL + 后端 + 前端。
#
# 用法：
#   cp .env.example .env  # 填入独立生成的数据库密码和 JWT 密钥
#   docker compose up -d --build
#   浏览器打开 http://localhost:8081
#
# 端口：
#   3306  MySQL
#   8080  后端 API
#   8081  前端（nginx 反代到后端）
#
# 数据：
#   MySQL 数据落在名为 mysql-data 的 named volume 里，删除容器不会丢。
#   要彻底重置：docker compose down -v
#
# 数据库密码和 JWT_SECRET 必须通过未提交的 .env 或环境变量提供。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: feedsystem
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: feedsystem
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    # 把容器内 ./.run/uploads 持久化到 named volume——之前没挂卷，
    # 每次 docker compose build / recreate 时上传的视频和封面会全部丢失。
    volumes:
      - backend-uploads:/app/.run/uploads

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
  backend-uploads:
